---
all:
  children:
    local:
      hosts:
        localhost:
          ansible_connection: local
    lab:
      vars:
        ansible_user: vagrant
      children:
        dns:
          hosts:
            dns01:
              ansible_host: 192.168.56.2
              dns_domain: lab.internal
              ansible_ssh_private_key_file: .vagrant/machines/dns01/virtualbox/private_key
        k3s01:
          children:
            k3s01_servers:
              hosts:
                k3s01-ctrl01:
                  ansible_host: 192.168.56.11
                  ansible_ssh_private_key_file: .vagrant/machines/k3s01-ctrl01/virtualbox/private_key
            k3s01_agents:
              hosts:
                k3s01-wrk01:
                  ansible_host: 192.168.56.12
                  ansible_ssh_private_key_file: .vagrant/machines/k3s01-wrk01/virtualbox/private_key
                k3s01-wrk02:
                  ansible_host: 192.168.56.13
                  ansible_ssh_private_key_file: .vagrant/machines/k3s01-wrk02/virtualbox/private_key
