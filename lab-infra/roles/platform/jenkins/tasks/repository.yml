---
- name: Configure Jenkins LTS repository
  ansible.builtin.yum_repository:
    name: jenkins
    description: Jenkins LTS repo
    baseurl: https://pkg.jenkins.io/redhat-stable/
    enabled: true
    gpgcheck: true
    gpgkey: https://pkg.jenkins.io/redhat-stable/jenkins.io-2026.key
    state: present
...