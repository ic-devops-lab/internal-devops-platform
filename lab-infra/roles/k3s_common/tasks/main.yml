---
- name: Install common packages
  ansible.builtin.apt:
    update_cache: yes
    # set k3s_common_packages in group_vars/k3s01.yml
    name: "{{ k3s_common_packages }}"
    state: present
  become: true

# Kubernetes nodes should not depend on active swap unless explicitly configured for it.
- name: Disable swap immediately
  ansible.builtin.command:
    cmd: swapoff -a
  changed_when: false
  become: true

- name: Disable swap permanently
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s+.*)$'
    replace: '# \1'
  become: true
...