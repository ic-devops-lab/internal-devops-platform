---
# Jenkins Controller config
jenkins_version: "2.580.2"
jenkins_java_version: "25"

jenkins_listen_interface: eth1
jenkins_http_port: 8080
jenkins_startup_timeout: 300

# Firewall for Jenkins Controller config
jenkins_firewall_enabled: true
jenkins_firewall_zone: lab
jenkins_firewall_services:
  - ssh

jenkins_firewall_ports:
  - "{{ jenkins_http_port }}/tcp"

# Jenkins Plugin Manager config
jenkins_plugin_manager_version: "2.15.0"
jenkins_plugin_manager_path: /opt/jenkins/plugin-manager.jar
jenkins_plugin_directory: /var/lib/jenkins/plugins
jenkins_plugin_manifest_path: /opt/jenkins/plugins.txt
jenkins_plugin_state_path: /var/lib/jenkins/.ansible-plugin-manifest.sha256

jenkins_plugins:
  - workflow-aggregator
  - git
  - credentials
  - credentials-binding
  - kubernetes
  - pipeline-graph-view
  - timestamper
  - warnings-ng
  - junit
  - ws-cleanup
  - configuration-as-code
  - job-dsl

# ---------- Jenkins Configuration as Code START ----------
jenkins_casc_enabled: true

# Jenkins controller
jenkins_url: "http://jenkins-test.lab.internal:8080"

# Kubernetes cloud
jenkins_k8s_cloud_name: "k3s"
jenkins_k8s_server_url: "https://192.168.56.11:6443"
jenkins_k8s_namespace: "default"
jenkins_k8s_credentials_id: "k3s-kubeconfig"
jenkins_k8s_container_cap: 10

# Kubernetes agent
jenkins_k8s_agent_name: "jenkins-k8s-agent"
jenkins_k8s_agent_label: "k8s-agent"
jenkins_k8s_agent_image: "iucovaliov/jenkins-cpp-agent:1.0"
jenkins_k8s_agent_workdir: "/home/jenkins/agent"
# ---------- Jenkins Configuration as Code END ----------
...